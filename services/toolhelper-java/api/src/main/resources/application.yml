server:
  address: 127.0.0.1
  port: ${TOOLHELPER_JAVA_PORT:0}

toolhelper:
  session-token: ${TOOLHELPER_SESSION_TOKEN}
  internal-token: ${TOOLHELPER_INTERNAL_TOKEN}
  allowed-origins: ${TOOLHELPER_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  internal-db-path: ${TOOLHELPER_INTERNAL_DB_PATH:}

spring:
  main:
    banner-mode: "off"
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration
