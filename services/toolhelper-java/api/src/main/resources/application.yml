server:
  address: 127.0.0.1
  port: ${TOOLHELPER_JAVA_PORT:0}

toolhelper:
  session-token: ${TOOLHELPER_SESSION_TOKEN}
  internal-token: ${TOOLHELPER_INTERNAL_TOKEN}
  allowed-origins: ${TOOLHELPER_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  internal-db-path: ${TOOLHELPER_INTERNAL_DB_PATH:}
  nodered:
    feed: ${TOOLHELPER_NODERED_FEED:}
    public-key: ${TOOLHELPER_NODERED_PUBLIC_KEY:}
    port: ${TOOLHELPER_NODERED_PORT:1880}
  electerm:
    feed: ${TOOLHELPER_ELECTERM_FEED:}
    public-key: ${TOOLHELPER_ELECTERM_PUBLIC_KEY:}
    port: ${TOOLHELPER_ELECTERM_PORT:5577}

spring:
  servlet:
    multipart:
      max-file-size: 768MB
      max-request-size: 769MB
  main:
    banner-mode: "off"
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration
